[build]
  command = "next build"
  publish = ".next"
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Project images: filenames are stable, cache forever (plan-performance-seo-privacy, Phase 2)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Resume PDF: block search indexing of personal documents (plan-performance-seo-privacy F7/F8)
[[headers]]
  for = "/resume.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
